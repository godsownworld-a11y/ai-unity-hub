<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>History — AI Unity Hub</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{color-scheme:dark;--bg:#030407;--panel:#0B0D12;--line:#202633;--muted:#929BAA;--text:#F5F7FA;--blue:#2878F5;--blue2:#1558C9;--lime:#D4FF24}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
header{min-height:72px;padding:14px 6%;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);background:#07090E}
.logo{font-size:21px;font-weight:800}.logo span{color:var(--lime)}
.nav{display:flex;gap:10px;flex-wrap:wrap}
.nav a{text-decoration:none;color:#B8C1CE;background:#10141D;border:1px solid #303B4D;padding:10px 14px;border-radius:9px;font-size:13px;transition:.2s}
.nav a:hover{color:#fff;border-color:var(--blue)}
.container{width:90%;max-width:1000px;margin:auto;padding:55px 0 75px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:30px}
.title small{color:var(--lime);font-size:11px;font-weight:bold;letter-spacing:2px}
.title h1{font-size:clamp(30px,4vw,38px);margin-top:8px}
.title p{color:var(--muted);font-size:14px;margin-top:8px}
.clear-btn{background:#171722;color:#FF9999;border:1px solid #493038;padding:11px 16px;border-radius:9px;cursor:pointer;font-weight:bold}
.clear-btn:hover{background:#241719;border-color:#75404A}
.history-list{display:flex;flex-direction:column;gap:12px}
.history-item{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:18px;display:flex;align-items:center;gap:15px;transition:border-color .2s}
.history-item:hover{border-color:var(--blue)}
.history-icon{width:46px;height:46px;border-radius:12px;background:#101D33;display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.history-info{flex:1;min-width:0}
.history-info h3{font-size:15px;margin-bottom:5px;overflow-wrap:anywhere}
.history-info p{color:#8994A5;font-size:12px;overflow-wrap:anywhere}
.empty{text-align:center;padding:85px 20px;background:var(--panel);border:1px solid var(--line);border-radius:19px}
.empty-icon{font-size:45px;margin-bottom:15px}
.empty h2{font-size:22px;margin-bottom:9px}
.empty p{color:var(--muted);font-size:14px;margin-bottom:25px}
.explore{display:inline-block;text-decoration:none;background:var(--blue2);border:1px solid var(--blue);color:white;padding:12px 19px;border-radius:9px;font-weight:bold;font-size:14px;transition:.2s}
.explore:hover{background:var(--blue)}
footer{border-top:1px solid var(--line);text-align:center;padding:25px;color:#778193;font-size:12px}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
@media(max-width:600px){header{padding:14px 4%;align-items:flex-start;flex-direction:column}.logo{font-size:18px}.nav{gap:7px}.nav a{padding:9px 10px;font-size:12px}.container{width:92%;padding-top:35px}.top{align-items:stretch;flex-direction:column}.title h1{font-size:30px}.clear-btn{width:100%}.empty{padding:60px 16px}.history-item{padding:14px}}
@media(max-width:360px){.nav a{padding:8px}.history-icon{width:40px;height:40px}}
</style>

</head>

<body>


<header>

    <div class="logo">
        AI <span>Unity Hub</span>
    </div>

    <div class="nav">

        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="profile.html">
            Profile
        </a>

        <a href="premium.html">
            Premium
        </a>

    </div>

</header>


<main class="container">


    <div class="top">

        <div class="title">

            <small>ACTIVITY</small>

            <h1>
                History
            </h1>

            <p>
                Your recent AI Unity Hub activity
            </p>

        </div>


        <button
            class="clear-btn"
            id="clearBtn">

            Clear History

        </button>

    </div>


    <div id="historyContainer"></div>


</main>


<footer>

    AI Unity Hub — by CK Izyaan

</footer>


<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA4aQj8bxLOmIdxJai3LEt6I1jV8BF0zJc",
    authDomain: "ai-unity-hub.firebaseapp.com",
    projectId: "ai-unity-hub",
    storageBucket: "ai-unity-hub.firebasestorage.app",
    messagingSenderId: "499702999885",
    appId: "1:499702999885:web:8f599c540741c39c4aa504",
    measurementId: "G-W3GGBB7VYX"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);
const historyContainer = document.getElementById("historyContainer");
const clearBtn = document.getElementById("clearBtn");
let historyKey = null;

function loadHistory() {
    let history = [];
    try {
        history = JSON.parse(localStorage.getItem(historyKey) || "[]");
        if (!Array.isArray(history)) history = [];
    } catch {
        history = [];
    }

    historyContainer.replaceChildren();

    if (history.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        const icon = document.createElement("div");
        icon.className = "empty-icon";
        icon.textContent = "🕘";
        const heading = document.createElement("h2");
        heading.textContent = "No history yet";
        const message = document.createElement("p");
        message.textContent = "Your successful AI tool results will appear here.";
        const link = document.createElement("a");
        link.href = "ai-tools-new.html";
        link.className = "explore";
        link.textContent = "Explore Tools";
        empty.append(icon, heading, message, link);
        historyContainer.appendChild(empty);
        return;
    }

    const list = document.createElement("div");
    list.className = "history-list";
    history.forEach(item => {
        const card = document.createElement("div");
        card.className = "history-item";
        const icon = document.createElement("div");
        icon.className = "history-icon";
        icon.textContent = item.icon || "⚡";
        const info = document.createElement("div");
        info.className = "history-info";
        const heading = document.createElement("h3");
        heading.textContent = item.title || "Tool Used";
        const time = document.createElement("p");
        time.textContent = item.time || "Recently";
        const result = document.createElement("p");
        result.style.marginTop = "8px";
        result.style.color = "#C5CEDB";
        result.textContent = item.result || "";
        info.append(heading, time, result);
        card.append(icon, info);
        list.appendChild(card);
    });
    historyContainer.appendChild(list);
}

clearBtn.addEventListener("click", () => {
    if (historyKey && confirm("Clear all history?")) {
        localStorage.removeItem(historyKey);
        loadHistory();
    }
});

onAuthStateChanged(auth, user => {
    if (!user) {
        window.location.replace("login.html");
        return;
    }
    historyKey = "aiUnityHistory_" + user.uid;
    loadHistory();
});
</script>


</body>
</html>
