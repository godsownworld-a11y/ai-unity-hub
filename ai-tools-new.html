
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tools — AI Unity Hub</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#030407;
    color:white;
}

header{
    padding:18px 7%;
    flex-wrap:wrap;
    border-bottom:1px solid #111722;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo{font-size:22px;font-weight:bold}

nav{display:flex;gap:18px;flex-wrap:wrap}

nav a{
    color:#aaa;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{color:white}\r\n\r\nnav a:focus-visible,.tool-tab:focus-visible,.generate:focus-visible,.small-btn:focus-visible{outline:2px solid #D4FF24;outline-offset:3px}

.container{
    max-width:950px;
    margin:40px auto;
    padding:20px;
}

h1{margin-bottom:8px}

.subtitle{
    color:#aaa;
    margin-bottom:25px;
}

.usage{
    background:#0B0D12;
    border:1px solid #202A38;
    border-radius:12px;
    padding:15px 18px;
    margin-bottom:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.usage-title{color:#aaa;font-size:14px}
.usage-count{font-weight:bold}

.tools-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-bottom:20px;
}

.tool-tab{
    padding:13px;
    border:1px solid #263244;
    background:#0B0D12;
    color:#aaa;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
    text-align:left;
}

.tool-tab:hover{
    border-color:#1558C9;
    color:white;
}

.tool-tab.active{
    background:#1558C9;
    color:white;
    border-color:#1558C9;
}

.tool-box{
    background:#0B0D12;
    border:1px solid #202A38;
    border-radius:14px;
    padding:25px;
}

label{
    display:block;
    margin:18px 0 8px;
    font-weight:bold;
}

textarea{
    width:100%;
    min-height:200px;
    resize:vertical;
    background:#070B12;
    color:white;
    border:1px solid #263244;
    border-radius:10px;
    padding:14px;
    font-size:15px;
    outline:none;
}

textarea:focus{border-color:#1558C9}

select{
    width:100%;
    padding:13px;
    background:#070B12;
    color:white;
    border:1px solid #263244;
    border-radius:10px;
    font-size:15px;
}

.generate{
    width:100%;
    margin-top:22px;
    padding:14px;
    background:#1558C9;
    color:white;
    border:0;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.generate:hover{background:#2878F5}

.generate:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.output-box{
    margin-top:25px;
    background:#070B12;
    border:1px solid #202A38;
    border-radius:10px;
    padding:18px;
    min-height:180px;
    white-space:pre-wrap;
    line-height:1.6;
}

.status{
    color:#aaa;
    margin-top:10px;
    font-size:14px;
}

.actions{
    margin-top:12px;
    display:flex;
    gap:10px;
}

.small-btn{
    padding:9px 15px;
    border-radius:7px;
    background:#111722;
    color:white;
    border:none;
    cursor:pointer;
}

footer{
    text-align:center;
    color:#777;
    padding:35px 10px;
}

@media(max-width:650px){
    header{
        flex-direction:column;
        align-items:flex-start;
    }

    nav{flex-wrap:wrap}

    .tools-grid{grid-template-columns:1fr}\r\n\r\n    .container{width:100%;margin:22px auto;padding:16px}\r\n\r\n    .usage{gap:12px;flex-wrap:wrap}

    .tool-box{padding:18px}
}
</style>
</head>

<body>

<header>
    <div class="logo">AI Unity Hub</div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="history.html">History</a>
        <a href="profile.html">Profile</a>
        <a href="premium.html">Premium</a>
    </nav>
</header>

<div class="container">

    <h1 id="pageTitle">AI Writer</h1>

    <div class="subtitle" id="pageSubtitle">
        Write, rewrite or improve your content.
    </div>

    <div class="usage">
        <div class="usage-title">AI Uses Today</div>
        <div class="usage-count" id="usageCount">0 / 5</div>
    </div>

    <div class="tools-grid">

        <button class="tool-tab active" data-tool="AI Writer">✍️ AI Writer</button>
        <button class="tool-tab" data-tool="Summarizer">📝 Summarizer</button>
        <button class="tool-tab" data-tool="Caption Generator">📸 Caption Generator</button>
        <button class="tool-tab" data-tool="Idea Generator">💡 Idea Generator</button>
        <button class="tool-tab" data-tool="Translator">🌍 Translator</button>
        <button class="tool-tab" data-tool="Email Writer">📧 Email Writer</button>
        <button class="tool-tab" data-tool="Text Improver">✨ Text Improver</button>
        <button class="tool-tab" data-tool="Rewriter">🔄 Rewriter</button>
        <button class="tool-tab" data-tool="Grammar Helper">📝 Grammar Helper</button>
        <button class="tool-tab" data-tool="Title Generator">🎯 Title Generator</button>

    </div>

    <div class="tool-box">

        <label id="inputLabel">What do you want to write?</label>

        <textarea
            id="userText"
            placeholder="Write your request here..."
        ></textarea>

        <div id="optionsArea">

            <label id="optionLabel">Style</label>

            <select id="option">
                <option>Professional</option>
                <option>Casual</option>
                <option>Creative</option>
                <option>Friendly</option>
                <option>Short & Clean</option>
            </select>

        </div>

        <div id="languageArea">

            <label for="outputLanguage">Output Language</label>

            <select id="outputLanguage">
                <option value="Auto Detect">Auto Detect</option>
                <option value="English">English</option>
                <option value="Malayalam">Malayalam</option>
                <option value="Manglish">Manglish</option>
                <option value="Hindi">Hindi</option>
                <option value="Tamil">Tamil</option>
                <option value="Arabic">Arabic</option>
                <option value="Spanish">Spanish</option>
                <option value="French">French</option>
                <option value="German">German</option>
                <option value="Japanese">Japanese</option>
                <option value="Korean">Korean</option>
                <option value="Chinese">Chinese</option>
                <option value="Portuguese">Portuguese</option>
                <option value="Italian">Italian</option>
                <option value="Russian">Russian</option>
                <option value="Bengali">Bengali</option>
                <option value="Urdu">Urdu</option>
                <option value="Kannada">Kannada</option>
                <option value="Telugu">Telugu</option>
            </select>

        </div>

        <button class="generate" id="generateBtn">
            Generate
        </button>

        <div class="output-box" id="output">AI OUTPUT</div>

        <div class="status" id="status">Ready</div>

        <div class="actions">

            <button class="small-btn" id="copyBtn">Copy</button>
            <button class="small-btn" id="clearBtn">Clear</button>

        </div>

    </div>

</div>

<footer>
    AI Unity Hub — by CK Izyaan
</footer>

<script type="module">

import { initializeApp, getApps, getApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";


/* FIREBASE */

const firebaseConfig = {
    apiKey: "AIzaSyA4aQj8bxLOmIdxJai3LEt6I1jV8BF0zJc",
    authDomain: "ai-unity-hub.firebaseapp.com",
    projectId: "ai-unity-hub",
    storageBucket: "ai-unity-hub.firebasestorage.app",
    messagingSenderId: "499702999885",
    appId: "1:499702999885:web:8f599c540741c39c4aa504",
    measurementId: "G-W3GGBB7VYX"
};

const app = getApps().length
    ? getApp()
    : initializeApp(firebaseConfig);

const auth = getAuth(app);


/* ELEMENTS */

let currentUser = null;
let currentTool = "AI Writer";

const usageCount = document.getElementById("usageCount");
const generateBtn = document.getElementById("generateBtn");
const output = document.getElementById("output");
const status = document.getElementById("status");
const userText = document.getElementById("userText");
const pageTitle = document.getElementById("pageTitle");
const pageSubtitle = document.getElementById("pageSubtitle");
const inputLabel = document.getElementById("inputLabel");
const option = document.getElementById("option");
const optionLabel = document.getElementById("optionLabel");
const outputLanguage = document.getElementById("outputLanguage");
const languageArea = document.getElementById("languageArea");
const aiCaptionPhotoBox = document.getElementById("aiCaptionPhotoBox");
const aiCaptionPhoto = document.getElementById("aiCaptionPhoto");
const aiCaptionPhotoPreview = document.getElementById("aiCaptionPhotoPreview");
const aiCaptionPhotoStatus = document.getElementById("aiCaptionPhotoStatus");
let aiCaptionImageToText = null;

aiCaptionPhoto.addEventListener("change", () => {
    const file = aiCaptionPhoto.files && aiCaptionPhoto.files[0];
    if (!file) {
        aiCaptionPhotoPreview.style.display = "none";
        aiCaptionPhotoStatus.textContent = "Choose a photo or type a description.";
        return;
    }
    if (!file.type.startsWith("image/")) {
        aiCaptionPhoto.value = "";
        aiCaptionPhotoStatus.textContent = "Please choose an image file.";
        return;
    }
    aiCaptionPhotoPreview.src = URL.createObjectURL(file);
    aiCaptionPhotoPreview.style.display = "block";
    aiCaptionPhotoStatus.textContent = "Photo selected. AI will analyze it when you generate.";
});


/* LOGIN */

onAuthStateChanged(auth, (user) => {

    if (user) {
        currentUser = user;
        console.log("LOGIN FOUND:", user.email);
    } else {
        currentUser = null;
        console.log("NO LOGIN");
    }

});


/* SAVED USAGE DISPLAY */

const savedUsage = localStorage.getItem("aiUnityAiUsesToday");

if (savedUsage !== null) {
    usageCount.innerText = savedUsage + " / 5";
}


/* TOOL INFORMATION */

const toolInfo = {

    "AI Writer": {
        title: "AI Writer",
        subtitle: "Write, rewrite or improve your content.",
        label: "What do you want to write?",
        placeholder: "Write your request here...",
        optionLabel: "Tone",
        options: ["Professional", "Casual", "Creative", "Friendly", "Short & Clean"]
    },

    "Summarizer": {
        title: "AI Summarizer",
        subtitle: "Summarize long text quickly and clearly.",
        label: "Paste the text you want to summarize",
        placeholder: "Paste your text here...",
        optionLabel: "Summary Style",
        options: ["Short", "Detailed", "Bullet Points", "Simple"]
    },

    "Caption Generator": {
        title: "Caption Generator",
        subtitle: "Create captions for Instagram, reels and social media.",
        label: "What should the caption be about?",
        placeholder: "Example: Beachinte aduthulla sunset ulla pic aanu...",
        optionLabel: "Caption Style",
        options: ["Clean", "Creative", "Emotional", "Mass", "Short"]
    },

    "Idea Generator": {
        title: "Idea Generator",
        subtitle: "Generate fresh creative ideas.",
        label: "What do you need ideas for?",
        placeholder: "Example: Instagram reel ideas",
        optionLabel: "Idea Style",
        options: ["Creative", "Viral", "Professional", "Simple", "Unique"]
    },

    "Translator": {
        title: "Translator",
        subtitle: "Translate your text into another language.",
        label: "What text do you want to translate?",
        placeholder: "Enter your text here...",
        optionLabel: "Target Language",
        options: ["English", "Malayalam", "Hindi", "Arabic", "Spanish", "Tamil", "French", "German"]
    },

    "Email Writer": {
        title: "Email Writer",
        subtitle: "Create clear and professional emails.",
        label: "What should the email say?",
        placeholder: "Describe what the email is about...",
        optionLabel: "Email Tone",
        options: ["Professional", "Friendly", "Formal", "Short", "Apology"]
    },

    "Text Improver": {
        title: "Text Improver",
        subtitle: "Make your text clearer and better.",
        label: "Paste your text",
        placeholder: "Paste your text here...",
        optionLabel: "Improvement Style",
        options: ["Professional", "Clear", "Natural", "Short", "Creative"]
    },

    "Rewriter": {
        title: "Rewriter",
        subtitle: "Rewrite your text in a better way.",
        label: "Paste the text you want to rewrite",
        placeholder: "Paste your text here...",
        optionLabel: "Rewrite Style",
        options: ["Professional", "Simple", "Creative", "Natural", "Short"]
    },

    "Grammar Helper": {
        title: "Grammar Helper",
        subtitle: "Fix grammar, spelling and sentence problems.",
        label: "Paste your text",
        placeholder: "Paste your text here...",
        optionLabel: "Correction Style",
        options: ["Fix Grammar", "Simple English", "Professional", "Natural", "Keep Original"]
    },

    "Title Generator": {
        title: "Title Generator",
        subtitle: "Generate strong titles for your content.",
        label: "What is your content about?",
        placeholder: "Example: YouTube video about Kerala",
        optionLabel: "Title Style",
        options: ["Professional", "Creative", "Short", "Viral", "Click-worthy"]
    }

};


/* CHANGE TOOL */

document.querySelectorAll(".tool-tab").forEach(button => {

    button.addEventListener("click", () => {

        document.querySelectorAll(".tool-tab").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        currentTool = button.dataset.tool;

        const info = toolInfo[currentTool];

        pageTitle.innerText = info.title;
        pageSubtitle.innerText = info.subtitle;
        inputLabel.innerText = info.label;
        userText.placeholder = info.placeholder;
        optionLabel.innerText = info.optionLabel;

        option.innerHTML = "";

        info.options.forEach(item => {

            const opt = document.createElement("option");
            opt.value = item;
            opt.textContent = item;
            option.appendChild(opt);

        });

        // Translator already has its own target language dropdown.
        languageArea.style.display =
            currentTool === "Translator" ? "none" : "block";

        userText.value = "";
        output.innerText = "AI OUTPUT";
        status.innerText = "Ready";

        // Reset output language when changing tools.
        outputLanguage.value = "Auto Detect";
        aiCaptionPhoto.value = "";
        aiCaptionPhotoPreview.removeAttribute("src");
        aiCaptionPhotoPreview.style.display = "none";
        aiCaptionPhotoStatus.textContent = "Choose a photo or type a description.";

    });

});


/* GENERATE */

generateBtn.addEventListener("click", async () => {

    const text = userText.value.trim();
    const selectedOption = option.value;

    const selectedLanguage =
        currentTool === "Translator"
            ? selectedOption
            : outputLanguage.value;


    if (!text) {
        output.innerText = "Please enter something first.";
        status.innerText = "Waiting for your request.";
        return;
    }


    let attempts = 0;

    while (!currentUser && attempts < 30) {

        await new Promise(resolve => setTimeout(resolve, 100));
        attempts++;

    }


    if (!currentUser) {
        output.innerText = "Please login first.";
        status.innerText = "Login session not found.";
        return;
    }


    generateBtn.disabled = true;
    generateBtn.innerText = "Generating...";
    output.innerText = "Connecting to AI Unity Hub...";
    status.innerText = "Generating...";


    try {

        const idToken = await currentUser.getIdToken();

        const response = await fetch(
            "https://ai-unity-hub-backend.onrender.com/api/generate",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json",
                    "Authorization": "Bearer " + idToken
                },

                body: JSON.stringify({
                    tool: currentTool,
                    text: text,
                    action: selectedOption,
                    tone: selectedOption,
                    outputLanguage: selectedLanguage
                })
            }
        );


        const result = await response.json();


        if (!response.ok) {
            throw new Error(result.error || "Server error");
        }


        output.innerText = result.result || "No result received.";
        status.innerText = "Completed ✓";


        // Save successful AI generations to this signed-in user's browser history.
        const historyKey = "aiUnityHistory_" + currentUser.uid;
        let savedHistory = [];
        try {
            savedHistory = JSON.parse(localStorage.getItem(historyKey) || "[]");
            if (!Array.isArray(savedHistory)) savedHistory = [];
        } catch {
            savedHistory = [];
        }

        const toolIcons = {
            "AI Writer": "✍️", "Summarizer": "📝", "Caption Generator": "📸",
            "Idea Generator": "💡", "Translator": "🌍", "Email Writer": "📧",
            "Text Improver": "✨", "Rewriter": "🔄", "Grammar Helper": "📝",
            "Title Generator": "🎯"
        };

        savedHistory.unshift({
            id: Date.now().toString(),
            title: currentTool,
            icon: toolIcons[currentTool] || "⚡",
            time: new Date().toLocaleString(),
            input: text,
            result: result.result || ""
        });
        localStorage.setItem(historyKey, JSON.stringify(savedHistory.slice(0, 50)));

        if (typeof result.aiUsesToday === "number") {

            usageCount.innerText = result.aiUsesToday + " / 5";

            localStorage.setItem(
                "aiUnityAiUsesToday",
                result.aiUsesToday
            );

        }


    } catch (error) {

        console.error(error);

        output.innerText = error.message;
        status.innerText = "Error";

    } finally {

        generateBtn.disabled = false;
        generateBtn.innerText = "Generate";

    }

});


/* COPY */

document.getElementById("copyBtn").addEventListener("click", async () => {

    const text = output.innerText;

    if (!text || text === "AI OUTPUT") {
        return;
    }

    try {

        await navigator.clipboard.writeText(text);
        status.innerText = "Copied ✓";

    } catch (error) {

        status.innerText = "Copy failed. Please select and copy manually.";

    }

});


/* CLEAR */

document.getElementById("clearBtn").addEventListener("click", () => {

    userText.value = "";
    output.innerText = "AI OUTPUT";
    status.innerText = "Ready";

});

</script>

<script type="module" src="auth-guard.js"></script>

</body>
</html>
