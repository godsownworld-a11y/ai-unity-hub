<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Tools — AI Unity Hub</title>

<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--bg:#030407;--panel:#0B0D12;--line:#202633;--muted:#929BAA;--text:#F5F7FA;--blue:#2878F5;--blue2:#1558C9;--lime:#D4FF24}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
header{min-height:70px;padding:14px 7%;border-bottom:1px solid var(--line);background:#07090E;display:flex;justify-content:space-between;align-items:center;gap:18px}
.logo{font-size:22px;font-weight:800}.logo span{color:var(--lime)}
nav{display:flex;gap:18px;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;font-size:14px;transition:color .2s}
nav a:hover{color:var(--lime)}
.container{width:min(92%,1000px);margin:40px auto}
h1{font-size:clamp(29px,4vw,38px);margin:0 0 8px;letter-spacing:-.7px}
.subtitle{color:var(--muted);margin:0 0 30px}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:25px}
.tab{background:var(--panel);color:#B8C1CE;border:1px solid var(--line);padding:12px 16px;border-radius:9px;cursor:pointer;transition:.2s}
.tab:hover{border-color:var(--blue);color:#fff}
.tab:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.tool{display:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:25px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.tool.active{display:block}
.tool h2{margin:0 0 8px}
label{display:block;margin:18px 0 8px;color:#D5DCE6}
textarea,input,select{width:100%;max-width:100%;padding:13px;border-radius:8px;border:1px solid #303B4D;background:#080B11;color:white;font-size:15px;outline:none}
textarea{min-height:150px;resize:vertical}
textarea:focus,input:focus,select:focus{border-color:var(--blue);outline:2px solid rgba(40,120,245,.18)}
button.generate{margin-top:20px;padding:13px 20px;border:1px solid var(--blue);border-radius:8px;background:var(--blue2);color:white;font-weight:bold;cursor:pointer;transition:.2s}
button.generate:hover{background:var(--blue)}
.output{margin-top:25px;padding:18px;min-height:100px;max-width:100%;overflow-wrap:anywhere;background:#080B11;border:1px solid var(--line);border-radius:10px;white-space:pre-wrap;line-height:1.6;color:#E4EAF2}
.output-actions{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
.small-btn{padding:9px 14px;background:#121722;color:white;border:1px solid #303B4D;border-radius:7px;cursor:pointer}
.small-btn:hover{background:#1A2433;border-color:var(--blue)}
footer{text-align:center;color:#778193;padding:35px 10px;border-top:1px solid var(--line);margin-top:60px}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
@media(max-width:600px){header{align-items:flex-start;flex-direction:column;padding:14px 5%;gap:12px}.container{width:94%;margin:25px auto}.tool{padding:18px}.tab{flex:1 1 45%}nav{gap:10px 16px;font-size:13px}.subtitle{margin-bottom:22px}}
@media(max-width:380px){.tool{padding:15px}.tab{flex-basis:100%}.output{padding:14px}}
</style>
</head>

<body>

<header>

    <div class="logo">
        AI <span>Unity Hub</span>
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="history.html">History</a>
        <a href="profile.html">Profile</a>
    </nav>

</header>

<div class="container">

    <h1>📚 Student Tools</h1>

    <p class="subtitle">
        Study smarter with AI-powered learning tools.
    </p>

    <div class="tabs">

        <button class="tab" onclick="openTool('notes')">
            📚 Notes Generator
        </button>

        <button class="tab" onclick="openTool('simplifier')">
            📝 Simplify Answer
        </button>

        <button class="tab" onclick="openTool('study')">
            📅 Study Plan
        </button>

        <button class="tab" onclick="openTool('questions')">
            ❓ Questions
        </button>

        <button class="tab" onclick="openTool('essay')">
            ✍️ Essay Writer
        </button>

    </div>


    <div class="tool active" id="notes">

        <h2>📚 Notes Generator</h2>

        <label>What topic do you want notes for?</label>

        <textarea
            id="notesTopic"
            placeholder="Example: Photosynthesis"
        ></textarea>

        <label>Level</label>

        <select id="notesLevel">
            <option>School</option>
            <option>College</option>
            <option>Beginner</option>
        </select>

        <button class="generate" onclick="generateNotes()">
            Generate Notes
        </button>

    </div>


    <div class="tool" id="simplifier">

        <h2>📝 Answer Simplifier</h2>

        <label>Paste your answer</label>

        <textarea
            id="simplifyText"
            placeholder="Paste a difficult answer here..."
        ></textarea>

        <button class="generate" onclick="simplifyAnswer()">
            Simplify Answer
        </button>

    </div>


    <div class="tool" id="study">

        <h2>📅 Study Plan</h2>

        <label>Subjects / topics</label>

        <textarea
            id="studySubjects"
            placeholder="Example: Maths, Physics, Biology"
        ></textarea>

        <label>Available study time per day</label>

        <select id="studyTime">
            <option>1 hour</option>
            <option>2 hours</option>
            <option>3 hours</option>
            <option>4 hours</option>
            <option>5+ hours</option>
        </select>

        <button class="generate" onclick="generateStudyPlan()">
            Create Study Plan
        </button>

    </div>


    <div class="tool" id="questions">

        <h2>❓ Question Generator</h2>

        <label>Topic</label>

        <textarea
            id="questionTopic"
            placeholder="Example: Class 10 Physics - Light"
        ></textarea>

        <label>Number of questions</label>

        <select id="questionCount">
            <option>5</option>
            <option>10</option>
            <option>15</option>
            <option>20</option>
        </select>

        <button class="generate" onclick="generateQuestions()">
            Generate Questions
        </button>

    </div>


    <div class="tool" id="essay">

        <h2>✍️ Essay Writer</h2>

        <label>Essay topic</label>

        <textarea
            id="essayTopic"
            placeholder="Example: Importance of protecting nature"
        ></textarea>

        <label>Length</label>

        <select id="essayLength">
            <option>Short</option>
            <option>Medium</option>
            <option>Long</option>
        </select>

        <button class="generate" onclick="generateEssay()">
            Write Essay
        </button>

    </div>


    <div class="output" id="output">
        Your AI result will appear here...
    </div>

    <div class="output-actions">

        <button class="small-btn" onclick="copyResult()">
            Copy
        </button>

        <button class="small-btn" onclick="clearResult()">
            Clear
        </button>

    </div>

</div>


<footer>
    AI Unity Hub — by CK Izyaan
</footer>


<script>

const BACKEND_URL = "https://ai-unity-hub-backend.onrender.com/api/generate";


function openTool(id) {

    document.querySelectorAll(".tool").forEach(tool => {
        tool.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

    document.getElementById("output").textContent =
        "Your AI result will appear here...";
}


async function sendRequest(tool, text, action, tone = "Natural") {

    const output = document.getElementById("output");

    output.textContent = "Generating...";

    try {

        const idToken = await window.aiUnityGetIdToken();

        const response = await fetch(BACKEND_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + idToken
            },

            body: JSON.stringify({
                tool: tool,
                text: text,
                action: action,
                tone: tone
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Request failed");
        }

        output.textContent = data.result;

    } catch (error) {

        output.textContent =
            "Connection error: " + error.message;

    }
}


function generateNotes() {

    const topic =
        document.getElementById("notesTopic").value;

    const level =
        document.getElementById("notesLevel").value;

    if (!topic) {
        alert("Please enter a topic.");
        return;
    }

    sendRequest(
        "Student Tool",
        `Create clear, well-structured ${level} study notes about: ${topic}. Include important points and key terms.`,
        "Generate Notes"
    );
}


function simplifyAnswer() {

    const text =
        document.getElementById("simplifyText").value;

    if (!text) {
        alert("Please paste an answer.");
        return;
    }

    sendRequest(
        "Student Tool",
        `Rewrite this answer using simple, clear language while keeping the important meaning:\n\n${text}`,
        "Simplify Answer"
    );
}


function generateStudyPlan() {

    const subjects =
        document.getElementById("studySubjects").value;

    const time =
        document.getElementById("studyTime").value;

    if (!subjects) {
        alert("Please enter your subjects.");
        return;
    }

    sendRequest(
        "Student Tool",
        `Create a practical study plan for these subjects: ${subjects}. The student has ${time} available per day. Include breaks and revision.`,
        "Create Study Plan"
    );
}


function generateQuestions() {

    const topic =
        document.getElementById("questionTopic").value;

    const count =
        document.getElementById("questionCount").value;

    if (!topic) {
        alert("Please enter a topic.");
        return;
    }

    sendRequest(
        "Student Tool",
        `Generate ${count} useful practice questions about: ${topic}. Mix easy, medium and challenging questions.`,
        "Generate Questions"
    );
}


function generateEssay() {

    const topic =
        document.getElementById("essayTopic").value;

    const length =
        document.getElementById("essayLength").value;

    if (!topic) {
        alert("Please enter an essay topic.");
        return;
    }

    sendRequest(
        "Student Tool",
        `Write a ${length} school-level essay about: ${topic}. Use a clear introduction, body and conclusion.`,
        "Write Essay"
    );
}


function copyResult() {

    const text =
        document.getElementById("output").textContent;

    navigator.clipboard.writeText(text);

    alert("Copied!");
}


function clearResult() {

    document.getElementById("output").textContent =
        "Your AI result will appear here...";
}

</script>
<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getAuth } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyA4aQj8bxLOmIdxJai3LEt6I1jV8BF0zJc",
    authDomain: "ai-unity-hub.firebaseapp.com",
    projectId: "ai-unity-hub",
    storageBucket: "ai-unity-hub.firebasestorage.app",
    messagingSenderId: "499702999885",
    appId: "1:499702999885:web:8f599c540741c39c4aa504",
    measurementId: "G-W3GGBB7VYX"
};

const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const auth = getAuth(app);

// Wait until Firebase has restored the saved login before checking the session.
await auth.authStateReady();

window.aiUnityGetIdToken = async function () {
    const user = auth.currentUser;
    if (!user) {
        throw new Error("Your login session was not found. Please sign in again.");
    }
    return await user.getIdToken();
};

if (!auth.currentUser) {
    window.location.replace("login.html");
}
</script>
</body>
</html>
